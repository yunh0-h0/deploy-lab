services:
  # ── PostgreSQL 데이터베이스 ──
  db:
    # Docker Hub의 공식 PostgreSQL 17 이미지. alpine은 용량이 작은 버전이다.
    # 처음 실행할 때 자동으로 내려받는다.
    image: postgres:17-alpine
    # 컨테이너가 처음 만들어질 때 이 값으로 사용자·비밀번호·DB를 만든다.
    # 로컬 실습 전용 값이다. 외부(Neon 등) DB에는 절대 같은 비밀번호를 쓰지 않는다.
    # Adminer 로그인과 apps/server/.env 의 DATABASE_URL이 이 값과 맞아야 한다.
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
      POSTGRES_DB: deploylab
    # 형식: "내컴퓨터IP:내컴퓨터포트:컨테이너포트"
    #   127.0.0.1         = 이 컴퓨터 안에서만 접속 허용 (같은 와이파이의 다른 사람은 못 들어옴)
    #   ${DB_PORT:-5432}  = 루트 .env의 DB_PORT 값, 없으면 5432. 서버는 localhost:이 번호로 DB에 붙는다.
    #   5432              = 컨테이너 안 PostgreSQL 포트 (고정). Adminer는 db:5432로 붙는다.
    # 확인: docker compose ps 의 PORTS 열에 127.0.0.1:5432->5432/tcp
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    # DB 파일을 dbdata 볼륨에 저장한다. 컨테이너를 지웠다 다시 만들어도 데이터가 남는다.
    volumes:
      - dbdata:/var/lib/postgresql/data
    # DB가 "실제로 접속을 받을 준비가 됐는지" 3초마다 검사한다(최대 20번).
    # 통과하면 상태가 healthy가 되고, up --wait와 adminer가 이것을 기다린다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d deploylab"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ── Adminer: 브라우저에서 DB 보기 ──
  # 접속: http://localhost:8080  (ADMINER_PORT를 바꿨으면 그 번호)
  # 로그인: 시스템 PostgreSQL / 서버 db / 사용자 lab / 비밀번호 lab-local-only / DB deploylab
  adminer:
    image: adminer:5
    # 로그인 화면의 "서버" 칸 기본값. 컨테이너끼리는 서비스 이름(db)으로 서로를 찾는다.
    # Adminer 안에서 localhost는 Adminer 자신이라 DB가 아니다.
    environment:
      ADMINER_DEFAULT_SERVER: db
    # 내 컴퓨터 127.0.0.1:ADMINER_PORT(기본 8080) → 컨테이너 안 8080
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    # db가 healthy가 된 뒤에 시작한다. (단순히 "켜졌다"가 아니라 "접속 가능"을 기다림)
    depends_on:
      db:
        condition: service_healthy

# 이름 있는 볼륨: Docker가 관리하는 저장 공간. docker volume ls 로 볼 수 있다.
# docker compose stop / down 으로는 지워지지 않고, down -v 를 해야 지워진다.
volumes:
  dbdata:
